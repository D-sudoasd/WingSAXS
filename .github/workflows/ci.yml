name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install linter
        run: python -m pip install -c constraints/validation-py311-313.txt ruff
      - name: Lint
        run: python -m ruff check src tests scripts

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"

    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Create isolated test environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv

          # The desktop launcher also discovers this project-local environment.
          environment = Path(os.environ["GITHUB_WORKSPACE"]) / ".venv-project"
          venv.EnvBuilder(with_pip=True, system_site_packages=False).create(environment)
          scripts = environment / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(str(scripts) + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"VIRTUAL_ENV={environment}\n")
              handle.write("PYTHONNOUSERSITE=1\n")

      - name: Install Linux Qt runtime and CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/validation-py311-313.txt ".[all]"

      - name: Check dependencies
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          assert sys.prefix != sys.base_prefix, sys.executable
          assert Path(sys.prefix).resolve() == Path(os.environ["VIRTUAL_ENV"]).resolve()
          subprocess.run([sys.executable, "-m", "pip", "check"], check=True)

      - name: Test
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest -q --basetemp "${{ runner.temp }}/pytest" -p no:cacheprovider

      - name: CLI and environment smoke
        run: |
          python -m butterfly_saxs --help
          bsaxs describe
          bsaxs doctor --json
          bsaxs preflight --help
          bsaxs benchmark --help
          bsaxs annotation-pack --help
          bsaxs p3-status --help
          bsaxs p4-evaluate --help
          bsaxs synthetic --shape 16x16
          bsaxs-doctor --json --require-ui

      - name: Windows desktop-launcher smoke
        if: runner.os == 'Windows'
        run: >-
          python -c "import subprocess, sys;
          sys.exit(subprocess.call(
          ['cmd', '/d', '/c', r'启动_LamellarSAXS2D.cmd', '--check']))"

  wheel-smoke:
    name: wheel smoke
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in a fresh environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-venv/bin/python" -m butterfly_saxs --help
          "$RUNNER_TEMP/wheel-venv/bin/bsaxs" synthetic --shape 16x16
          "$RUNNER_TEMP/wheel-venv/bin/bsaxs-doctor" --json
